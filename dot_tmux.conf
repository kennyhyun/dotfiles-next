# ~/.tmux.conf managed by chezmoi
# Migrated from legacy dotfiles with fixes.

setw -g mouse on

# ---- Prefix ----
# Use Control+a as the prefix (press twice to send a literal C-a).
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Window navigation with Shift+Arrows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Reload config
unbind-key r
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Double prefix+Ctrl+a cycles panes in a window
unbind-key ^A
bind-key ^A select-pane -t :.+

# ---- Terminal / colors ----
set -g default-terminal "screen-256color"

# ---- Copy mode (vi) ----
setw -g mode-keys vi
unbind-key -T copy-mode-vi v
unbind-key -T copy-mode-vi y
unbind-key -T copy-mode-vi C-v
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
unbind-key -T copy-mode-vi Enter

# ---- Split / new window: keep current working directory ----
# FIX: legacy config used ${pane_current_path} (shell expansion -> empty);
# the correct tmux format is #{pane_current_path}.
unbind-key '"'
unbind-key %
unbind-key c
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# ---- Resize panes ----
unbind-key <
unbind-key >
bind-key < resize-pane -L 10
bind-key > resize-pane -R 10

# ---- Pane navigation: prefix + h/j/k/l (plain, no vim integration) ----
# Legacy config used vim-tmux-navigator; removed by request. These are simple
# directional pane selects.
unbind-key h
unbind-key j
unbind-key k
unbind-key l
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
# Arrow-key equivalents for quick typing
unbind-key Left
unbind-key Down
unbind-key Up
unbind-key Right
bind-key Left  select-pane -L
bind-key Down  select-pane -D
bind-key Up    select-pane -U
bind-key Right select-pane -R

# ---- Window navigation: prefix + [ / ] ----
unbind-key n
unbind-key [
unbind-key ]
bind-key [ previous-window
bind-key ] next-window

# ---- Copy mode entry ----
unbind-key p
unbind-key C-u
bind-key p copy-mode
bind-key C-u copy-mode -eu

# Remove ESC key delay
set -s escape-time 0

# Prevent tmux from exiting with Ctrl+D
set-environment -g 'IGNOREEOF' 10

set-option -g history-limit 60000

# ---- Plugins (TPM) ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# ---- Prefix / copy-mode indicator in the status bar ----
# Shows a badge when the prefix (C-a) is pressed, and in copy-mode, so you can
# tell at a glance whether tmux is waiting for a prefixed key.
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @prefix_highlight_show_copy_mode 'on'      # also flag copy-mode
set -g @prefix_highlight_copy_mode_attr 'fg=black,bg=yellow,bold'
set -g @prefix_highlight_prefix_prompt 'WAIT'     # text shown while prefix held
set -g @prefix_highlight_copy_prompt 'COPY'
# The plugin only renders where you place its format var. Put it at the left of
# status-right (the right side keeps tmux's default time/date).
set -g status-right '#{prefix_highlight} "#{=21:pane_title}" %H:%M %d-%b-%y'

# NOTE: TPM loads only the @plugins declared ABOVE this run line.
run '~/.tmux/plugins/tpm/tpm'

# ---- Platform-specific clipboard ----
if-shell 'uname | grep -q Darwin' \
  'source-file ~/.tmux.mac.conf' \
  'source-file ~/.tmux.linux.conf'
