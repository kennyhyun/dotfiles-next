[env]
TERM = "xterm-256color"

[font]
size = 12

[[mouse.bindings]]
action = "Paste"
mouse = "Right"

[[mouse.bindings]]
action = "Paste"
mouse = "Middle"

[selection]
save_to_clipboard = true

[window]
blur = true
#decorations = "Buttonless"
decorations = "Full"
opacity = 0.7
option_as_alt = "Both"

[window.padding]
x = 10
y = 10
